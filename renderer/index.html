<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' file: data:" />
  <title>Kurator Session Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="titlebar">
      <div class="app-name"><img src="icon.ico" class="app-icon" alt=""> Kurator Session Manager</div>
      <div class="tabs">
        <button id="tab-play" class="active" onclick="window.app.switchMode('play')">Play</button>
        <button id="tab-create" onclick="window.app.switchMode('create')">Create</button>
      </div>
      <div class="tb-actions" id="play-actions"></div>
    </div>

    <div id="campaign-bar" class="campaign-bar"></div>

    <div id="selectors" class="selectors"></div>

    <div id="main-scroll" class="scroll-area">
      <div id="play-view"></div>
      <div id="create-view" style="display:none"></div>
    </div>
  </div>

  <div id="campaign-switcher" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeCampaignSwitcher()">
    <div class="modal-panel">
      <div class="modal-head">
        <span>Campaigns</span>
        <button class="mini-btn" onclick="window.app.closeCampaignSwitcher()">✕</button>
      </div>
      <div id="campaign-switcher-body"></div>
    </div>
  </div>

  <div id="omnisearch-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closePicker()">
    <div class="modal-panel">
      <div id="omnisearch-mode" class="omni-mode"></div>
      <input type="text" id="omnisearch-input" placeholder="Jump to a location or NPC…"
        oninput="window.app.onPickerInput(this.value)"
        onkeydown="window.app.onPickerKeydown(event)">
      <div id="omnisearch-results" class="picker-results"></div>
    </div>
  </div>

  <div id="loot-table-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeLootTableView()">
    <div class="modal-panel modal-panel-wide">
      <div class="modal-head">
        <span id="loot-table-title">Loot table</span>
        <button class="mini-btn" onclick="window.app.closeLootTableView()">✕</button>
      </div>
      <div id="loot-table-body"></div>
    </div>
  </div>

  <div id="inventory-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeInventoryView()">
    <div class="modal-panel modal-panel-wide">
      <div class="modal-head">
        <span id="inventory-title">Inventory</span>
        <button class="mini-btn" onclick="window.app.closeInventoryView()">✕</button>
      </div>
      <div id="inventory-body"></div>
    </div>
  </div>

  <div id="character-card-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeCharacterCard()">
    <div class="modal-panel cc-modal-panel">
      <div class="modal-head">
        <span id="character-card-title" class="card-title"></span>
        <span style="display:flex;gap:6px">
          <button class="icon-btn" title="Edit this card in Create mode" onclick="window.app.editCharacterCard()">Edit</button>
          <button class="mini-btn" title="Close (Esc)" onclick="window.app.closeCharacterCard()">✕</button>
        </span>
      </div>
      <div id="character-card-body"></div>
    </div>
  </div>

  <div id="statblock-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeStatblockEditor()">
    <div class="modal-panel cc-modal-panel">
      <div class="modal-head">
        <span id="statblock-title" class="card-title"></span>
        <button class="icon-btn" title="Close (Esc)" onclick="window.app.closeStatblockEditor()">Done</button>
      </div>
      <div id="statblock-body"></div>
    </div>
  </div>

  <div id="help-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeHelp()">
    <div class="modal-panel">
      <div class="modal-head">
        <span>Keyboard shortcuts</span>
        <button class="mini-btn" onclick="window.app.closeHelp()">✕</button>
      </div>
      <div id="help-body"></div>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeSettings()">
    <div class="modal-panel">
      <div class="modal-head">
        <span>Settings</span>
        <button class="mini-btn" onclick="window.app.closeSettings()">✕</button>
      </div>
      <div id="settings-body"></div>
    </div>
  </div>

  <div id="director-picker-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeDirectorPicker()">
    <div class="modal-panel">
      <div class="modal-head">
        <span id="director-picker-title">Choose a scene</span>
        <button class="mini-btn" onclick="window.app.closeDirectorPicker()">✕</button>
      </div>
      <div id="director-picker-body"></div>
    </div>
  </div>

  <div id="assign-from-library-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeAssignFromLibrary()">
    <div class="modal-panel">
      <div class="modal-head">
        <span id="assign-from-library-title">Add from library</span>
        <button class="mini-btn" onclick="window.app.closeAssignFromLibrary()">✕</button>
      </div>
      <div id="assign-from-library-body"></div>
    </div>
  </div>

  <div id="dc-check-editor-modal" class="modal-overlay" style="display:none">
    <div class="modal-panel modal-panel-wide modal-panel-fixed-footer">
      <div class="modal-head">
        <span id="dc-check-editor-title">DC Check</span>
        <button class="mini-btn" onclick="window.app.closeDCCheckEditor()">✕</button>
      </div>
      <div id="dc-check-editor-body" class="modal-scroll-body"></div>
      <div id="dc-check-editor-footer" class="modal-footer"></div>
    </div>
  </div>

  <div id="dc-check-play-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeDCCheckPlay()">
    <div class="modal-panel modal-panel-wide modal-panel-fixed-footer">
      <div class="modal-head">
        <span id="dc-check-play-title">DC Check</span>
        <button class="mini-btn" onclick="window.app.closeDCCheckPlay()">✕</button>
      </div>
      <div id="dc-check-play-body" class="modal-scroll-body"></div>
      <div id="dc-check-play-footer" class="modal-footer"></div>
    </div>
  </div>

  <div id="image-lightbox-modal" class="image-lightbox-overlay" style="display:none" onclick="window.app.closeImageLightbox()">
    <img id="image-lightbox-img" src="" alt="">
  </div>

  <div id="image-crop-modal" class="modal-overlay" style="display:none">
    <div class="modal-panel modal-panel-fixed-footer" style="max-width:360px">
      <div class="modal-head">
        <span>Crop image</span>
        <button class="mini-btn" onclick="window.app.closeImageCropModal()">✕</button>
      </div>
      <div class="modal-scroll-body">
        <div id="image-crop-viewport" class="image-crop-viewport" onmousedown="window.app.startImageCropDrag(event)">
          <img id="image-crop-img" class="image-crop-img" alt="" draggable="false">
        </div>
        <div class="form-row" style="margin-top:12px">
          <label>Zoom</label>
          <input type="range" id="image-crop-zoom" min="1" max="3" step="0.01" value="1" oninput="window.app.onImageCropZoomInput(this.value)">
        </div>
        <p class="hint">Drag the image to reposition it within the frame.</p>
      </div>
      <div class="modal-footer">
        <button class="icon-btn" onclick="window.app.saveImageCrop()">Save</button>
        <button class="mini-btn" onclick="window.app.closeImageCropModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="artwork-modal" class="modal-overlay" style="display:none">
    <div class="modal-panel" style="max-width:560px">
      <div class="modal-head">
        <span id="artwork-modal-title">Artwork found</span>
        <button class="mini-btn" onclick="window.app.closeArtworkModal()">✕</button>
      </div>
      <div class="modal-scroll-body">
        <p class="hint" id="artwork-modal-hint"></p>
        <div id="artwork-modal-grid" class="artwork-grid"></div>
      </div>
      <div class="modal-footer">
        <button class="mini-btn" onclick="window.app.closeArtworkModal()">No thanks</button>
      </div>
    </div>
  </div>

  <div id="notion-import-modal" class="modal-overlay" style="display:none">
    <div class="modal-panel modal-panel-wide modal-panel-fixed-footer">
      <div class="modal-head">
        <span>Import content from Notion</span>
        <button class="mini-btn" onclick="window.app.closeNotionImport()">✕</button>
      </div>
      <div id="notion-import-body" class="modal-scroll-body"></div>
      <div id="notion-import-footer" class="modal-footer"></div>
    </div>
  </div>

  <div id="gv-win" class="gv-win" style="display:none"></div>

  <div id="transfer-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.app.closeTransfer()">
    <div class="modal-panel modal-panel-wide modal-panel-fixed-footer">
      <div class="modal-head">
        <span>Transfer to other campaign</span>
        <button class="mini-btn" onclick="window.app.closeTransfer()">✕</button>
      </div>
      <div id="transfer-body" class="modal-scroll-body"></div>
      <div id="transfer-footer" class="modal-footer"></div>
    </div>
  </div>
  <div id="transfer-targets-modal" class="modal-overlay" style="display:none;z-index:850" onclick="if(event.target===this)window.app.trCloseTargets()"></div>

  <script src="vendor-bundle.js"></script>
  <script src="health.js"></script>
  <script src="textFullscreen.js"></script>
  <script src="treeDnd.js"></script>
  <script src="graphView.js"></script>
  <script src="conditionsView.js"></script>
  <script src="questsView.js"></script>
  <script src="app.js"></script>
</body>
</html>
